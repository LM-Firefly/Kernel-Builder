name: Build Kernel Releases

on:
  push:
    paths:
      - ".github/workflows/build-kernels.yml"
      - ".env.example"
      - "kernel-builder.json"
      - "scripts/**"
      - "patches/**"
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      template_repository:
        description: "Template repository containing the fixed shell and Go adapter (blank: .env)"
        required: false
        type: string
        default: ""
      template_ref:
        description: "Template branch, tag, or commit (blank: .env)"
        required: false
        type: string
        default: ""
      kernel_repository:
        description: "Override the kernel Git URL for every channel (blank: kernel-builder.json)"
        required: false
        type: string
        default: ""
      kernel_ref:
        description: "Override the kernel branch, tag, or commit for every channel (blank: kernel-builder.json)"
        required: false
        type: string
        default: ""
      go_version:
        description: "Go version (blank: .env)"
        required: false
        type: string
        default: ""
      go_download_base_url:
        description: "Go distribution base URL (blank: .env)"
        required: false
        type: string
        default: ""
      android_ndk_version:
        description: "Android NDK version (blank: .env)"
        required: false
        type: string
        default: ""
      android_min_sdk:
        description: "Android minimum SDK (blank: .env)"
        required: false
        type: string
        default: ""
      java_version:
        description: "Java version (blank: .env)"
        required: false
        type: string
        default: ""
      release_tag:
        description: "Release tag to update (blank: .env)"
        required: false
        type: string
        default: ""
  repository_dispatch:
    types: [kernel-update]

permissions:
  contents: write

concurrency:
  group: kernel-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate-config:
    name: Validate configuration
    runs-on: ubuntu-latest
    env:
      INPUT_TEMPLATE_REPOSITORY: ${{ inputs.template_repository }}
      INPUT_TEMPLATE_REF: ${{ inputs.template_ref }}
      INPUT_KERNEL_REPOSITORY: ${{ inputs.kernel_repository }}
      INPUT_KERNEL_REF: ${{ inputs.kernel_ref }}
      INPUT_GO_VERSION: ${{ inputs.go_version }}
      INPUT_GO_DOWNLOAD_BASE_URL: ${{ inputs.go_download_base_url }}
      INPUT_ANDROID_NDK_VERSION: ${{ inputs.android_ndk_version }}
      INPUT_ANDROID_MIN_SDK: ${{ inputs.android_min_sdk }}
      INPUT_JAVA_VERSION: ${{ inputs.java_version }}
      INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
    outputs:
      matrix: ${{ steps.config.outputs.matrix }}
      template_repository: ${{ steps.config.outputs.template_repository }}
      template_ref: ${{ steps.config.outputs.template_ref }}
      android_ndk_version: ${{ steps.config.outputs.android_ndk_version }}
      android_min_sdk: ${{ steps.config.outputs.android_min_sdk }}
      android_abi: ${{ steps.config.outputs.android_abi }}
      java_version: ${{ steps.config.outputs.java_version }}
      go_version: ${{ steps.config.outputs.go_version }}
      go_download_base_url: ${{ steps.config.outputs.go_download_base_url }}
      release_tag: ${{ steps.config.outputs.release_tag }}
      release_name: ${{ steps.config.outputs.release_name }}
      release_prerelease: ${{ steps.config.outputs.release_prerelease }}
      release_make_latest: ${{ steps.config.outputs.release_make_latest }}
      compression_level: ${{ steps.config.outputs.compression_level }}
    steps:
      - uses: actions/checkout@v6

      - name: Validate runner tools
        run: |
          set -euo pipefail
          command -v git
          command -v jq
          command -v xz
          command -v sha256sum
          command -v readelf
          command -v file

      - id: config
        name: Parse .env and builder configuration
        shell: bash
        run: |
          set -euo pipefail
          source scripts/load-env.sh .env
          scripts/validate-config.sh .env kernel-builder.json
          TEMPLATE_REPOSITORY="${INPUT_TEMPLATE_REPOSITORY:-$TEMPLATE_REPOSITORY}"
          TEMPLATE_REF="${INPUT_TEMPLATE_REF:-$TEMPLATE_REF}"
          GO_VERSION="${INPUT_GO_VERSION:-$GO_VERSION}"
          GO_DOWNLOAD_BASE_URL="${INPUT_GO_DOWNLOAD_BASE_URL:-$GO_DOWNLOAD_BASE_URL}"
          ANDROID_NDK_VERSION="${INPUT_ANDROID_NDK_VERSION:-$ANDROID_NDK_VERSION}"
          ANDROID_MIN_SDK="${INPUT_ANDROID_MIN_SDK:-$ANDROID_MIN_SDK}"
          JAVA_VERSION="${INPUT_JAVA_VERSION:-$JAVA_VERSION}"
          RELEASE_TAG="${INPUT_RELEASE_TAG:-$RELEASE_TAG}"

          [[ "$TEMPLATE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ -n "$TEMPLATE_REF" && -n "$GO_VERSION" && -n "$JAVA_VERSION" ]]
          [[ "$GO_DOWNLOAD_BASE_URL" =~ ^https://.+ ]]
          [[ "$ANDROID_NDK_VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]
          [[ "$ANDROID_MIN_SDK" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9._-]+$ ]]
          if [[ -n "$INPUT_KERNEL_REPOSITORY" ]]; then
            [[ "$INPUT_KERNEL_REPOSITORY" =~ ^(https://|git@).+ ]]
          fi
          if [[ -n "$INPUT_KERNEL_REF" ]]; then
            [[ ! "$INPUT_KERNEL_REF" =~ [[:space:]] ]]
          fi

          matrix=$(jq -ce \
            --arg repository "$INPUT_KERNEL_REPOSITORY" \
            --arg ref "$INPUT_KERNEL_REF" \
            '.channels | map(
              if $repository != "" then .repository = $repository else . end |
              if $ref != "" then .ref = $ref else . end
            )' kernel-builder.json)

          {
            printf 'matrix=%s\n' "$matrix"
            printf 'template_repository=%s\n' "$TEMPLATE_REPOSITORY"
            printf 'template_ref=%s\n' "$TEMPLATE_REF"
            printf 'android_ndk_version=%s\n' "$ANDROID_NDK_VERSION"
            printf 'android_min_sdk=%s\n' "$ANDROID_MIN_SDK"
            printf 'android_abi=%s\n' "$ANDROID_ABI"
            printf 'java_version=%s\n' "$JAVA_VERSION"
            printf 'go_version=%s\n' "$GO_VERSION"
            printf 'go_download_base_url=%s\n' "$GO_DOWNLOAD_BASE_URL"
            printf 'release_tag=%s\n' "$RELEASE_TAG"
            printf 'release_name=%s\n' "$RELEASE_NAME"
            printf 'release_prerelease=%s\n' "$RELEASE_PRERELEASE"
            printf 'release_make_latest=%s\n' "$RELEASE_MAKE_LATEST"
            printf 'compression_level=%s\n' "$COMPRESSION_LEVEL"
          } >> "$GITHUB_OUTPUT"

  detect-upstream:
    name: Detect ${{ matrix.channel.id }} upstream
    needs: validate-config
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(needs.validate-config.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve remote commit
        env:
          CHANNEL_ID: ${{ matrix.channel.id }}
          KERNEL_REPOSITORY: ${{ matrix.channel.repository }}
          KERNEL_REF: ${{ matrix.channel.ref }}
          KERNEL_REPOSITORY_TOKEN: ${{ secrets.KERNEL_REPOSITORY_TOKEN }}
        run: |
          set -euo pipefail
          source_url="$KERNEL_REPOSITORY"
          if [ -n "${KERNEL_REPOSITORY_TOKEN:-}" ] && [[ "$source_url" == https://github.com/* ]]; then
            source_url="${source_url/https:\/\//https://x-access-token:${KERNEL_REPOSITORY_TOKEN}@}"
          fi
          commit=$(git ls-remote "$source_url" "$KERNEL_REF" | awk 'NR == 1 { print $1 }')
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          jq -n \
            --arg id "$CHANNEL_ID" \
            --arg repository "$KERNEL_REPOSITORY" \
            --arg ref "$KERNEL_REF" \
            --arg commit "$commit" \
            '{id: $id, repository: $repository, ref: $ref, commit: $commit}' \
            > upstream.json
          jq empty upstream.json

      - uses: actions/upload-artifact@v7
        with:
          name: upstream-arm64-${{ matrix.channel.id }}
          path: upstream.json
          if-no-files-found: error
          retention-days: 2

  build-core:
    name: Build ${{ matrix.channel.id }} arm64
    needs: [validate-config, detect-upstream]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(needs.validate-config.outputs.matrix) }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      ABI_APP_LIST: ${{ needs.validate-config.outputs.android_abi }}
    steps:
      - name: Checkout builder configuration
        uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: upstream-arm64-${{ matrix.channel.id }}
          path: upstream

      - name: Checkout YumeBox source template
        uses: actions/checkout@v6
        with:
          repository: ${{ needs.validate-config.outputs.template_repository }}
          ref: ${{ needs.validate-config.outputs.template_ref }}
          path: app-template
          token: ${{ secrets.TEMPLATE_REPOSITORY_TOKEN || github.token }}
          fetch-depth: 1

      - name: Verify YumeBox native source contract
        working-directory: app-template
        run: |
          set -euo pipefail
          test -f scripts/native-build.main.kts
          test -f lib/native/go/native/entry.go
          test -f lib/native/go/go.mod
          test -f lib/native/shell/CMakeLists.txt
          test -f lib/native/shell/shell.c
          test -f kernel.properties

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ needs.validate-config.outputs.java_version }}

      - uses: fwilhe2/setup-kotlin@88d53291848568823e529973af5d0cdb8ddf8d87

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: ${{ needs.validate-config.outputs.go_download_base_url }}
          go-version: ${{ needs.validate-config.outputs.go_version }}
          cache: false

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699

      - name: Install Android NDK
        run: sdkmanager "ndk;${{ needs.validate-config.outputs.android_ndk_version }}"

      - name: Configure template toolchain
        working-directory: app-template
        run: |
          printf 'sdk.dir=%s\nndk.dir=%s/ndk/%s\n' "$ANDROID_SDK_ROOT" "$ANDROID_SDK_ROOT" "${{ needs.validate-config.outputs.android_ndk_version }}" > local.properties

      - name: Fetch selected kernel source
        working-directory: app-template
        env:
          KERNEL_REPOSITORY: ${{ matrix.channel.repository }}
          KERNEL_REF: ${{ matrix.channel.ref }}
          KERNEL_REPOSITORY_TOKEN: ${{ secrets.KERNEL_REPOSITORY_TOKEN }}
        run: |
          set -euo pipefail
          target=lib/mihomo/mihomo
          rm -rf "$target"
          mkdir -p "$target"
          git -C "$target" init --quiet
          source_url="$KERNEL_REPOSITORY"
          if [ -n "${KERNEL_REPOSITORY_TOKEN:-}" ] && [[ "$source_url" == https://github.com/* ]]; then
            source_url="${source_url/https:\/\//https://x-access-token:${KERNEL_REPOSITORY_TOKEN}@}"
          fi
          git -C "$target" remote add origin "$source_url"
          git -C "$target" fetch --depth=1 origin "$KERNEL_REF"
          git -C "$target" checkout --detach --quiet FETCH_HEAD
          expected_commit=$(jq -r '.commit' "$GITHUB_WORKSPACE/upstream/upstream.json")
          actual_commit=$(git -C "$target" rev-parse HEAD)
          test "$actual_commit" = "$expected_commit"
          git -C "$target" remote set-url origin "$KERNEL_REPOSITORY"

      - name: Apply channel patches
        env:
          PATCH_DIRECTORY: ${{ matrix.channel.patches }}
        run: |
          set -euo pipefail
          mkdir -p app-template/.github/patches/mihomo
          cp -a "$PATCH_DIRECTORY"/. app-template/.github/patches/mihomo/

      - name: Synchronize Go module graph with selected kernel
        working-directory: app-template
        run: |
          set -euo pipefail
          # The YumeBox template is intentionally fixed, while the selected kernel can move
          # independently. Tidy both modules after checkout so indirect dependencies from the
          # kernel (including jls-quic-go) are not pinned to the template's older graph.
          go mod tidy -C lib/mihomo
          go mod tidy -C lib/native/go

      - name: Build ARM64 core through the fixed shell adapter
        working-directory: app-template
        env:
          EXTERNAL_MIHOMO_BRANCH: ${{ matrix.channel.id }}
          EXTERNAL_MIHOMO_SUFFIX: ${{ matrix.channel.suffix }}
          ANDROID_MIN_SDK: ${{ needs.validate-config.outputs.android_min_sdk }}
        run: kotlin scripts/native-build.main.kts --go

      - name: Record immutable source metadata
        working-directory: app-template
        env:
          KERNEL_REPOSITORY: ${{ matrix.channel.repository }}
          KERNEL_REF: ${{ matrix.channel.ref }}
          EXPECTED_COMMIT_FILE: ${{ github.workspace }}/upstream/upstream.json
        run: |
          set -euo pipefail
          core_dir="jniLibs/${{ needs.validate-config.outputs.android_abi }}"
          source_commit=$(git -C lib/mihomo/mihomo rev-parse HEAD)
          expected_commit=$(jq -r '.commit' "$EXPECTED_COMMIT_FILE")
          test "$source_commit" = "$expected_commit"
          template_commit=$(git rev-parse HEAD)
          jq -n \
            --arg repository "$KERNEL_REPOSITORY" \
            --arg ref "$KERNEL_REF" \
            --arg commit "$source_commit" \
            --arg templateCommit "$template_commit" \
            '{repository: $repository, ref: $ref, commit: $commit, templateCommit: $templateCommit}' \
            > "$core_dir/source.json"

      - name: Stage raw core
        run: |
          set -euo pipefail
          artifact_dir="kernel-artifact/${{ matrix.channel.id }}/${{ needs.validate-config.outputs.android_abi }}"
          mkdir -p "$artifact_dir"
          cp "app-template/jniLibs/${{ needs.validate-config.outputs.android_abi }}/libmihomocore.so" "$artifact_dir/"
          cp "app-template/jniLibs/${{ needs.validate-config.outputs.android_abi }}/core-version.properties" "$artifact_dir/"
          cp "app-template/jniLibs/${{ needs.validate-config.outputs.android_abi }}/source.json" "$artifact_dir/"

      - uses: actions/upload-artifact@v7
        with:
          name: raw-arm64-${{ matrix.channel.id }}
          path: kernel-artifact
          if-no-files-found: error
          retention-days: 7

  verify-core:
    name: Verify ${{ matrix.channel.id }} arm64
    needs: [validate-config, build-core]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(needs.validate-config.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: raw-arm64-${{ matrix.channel.id }}
          path: raw-artifacts

      - name: Verify Android ELF and shell entrypoint contract
        run: |
          set -euo pipefail
          mapfile -t cores < <(find raw-artifacts -type f -name libmihomocore.so -print)
          test "${#cores[@]}" -eq 1
          core=${cores[0]}
          scripts/verify-core.sh "$core" "${{ needs.validate-config.outputs.android_abi }}"
          mapfile -t source_files < <(find raw-artifacts -type f -name source.json -print)
          test "${#source_files[@]}" -eq 1
          source_json=${source_files[0]}
          jq -e '.commit | test("^[0-9a-f]{40}$")' "$source_json" >/dev/null
          jq -e '.templateCommit | test("^[0-9a-f]{40}$")' "$source_json" >/dev/null

      - name: Stage verified core
        run: |
          set -euo pipefail
          core=$(find raw-artifacts -type f -name libmihomocore.so -print -quit)
          source_dir=$(dirname "$core")
          target_dir="verified-artifact/${{ matrix.channel.id }}/${{ needs.validate-config.outputs.android_abi }}"
          mkdir -p "$target_dir"
          cp "$source_dir/libmihomocore.so" "$source_dir/core-version.properties" "$source_dir/source.json" "$target_dir/"

      - uses: actions/upload-artifact@v7
        with:
          name: verified-arm64-${{ matrix.channel.id }}
          path: verified-artifact
          if-no-files-found: error
          retention-days: 7

  package-release:
    name: Compress cores and generate release JSON
    needs: [validate-config, verify-core]
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          pattern: verified-arm64-*
          path: verified-artifacts
          merge-multiple: true

      - id: release
        name: Package assets, checksums, and manifest
        env:
          RELEASE_TAG: ${{ needs.validate-config.outputs.release_tag }}
          TEMPLATE_REPOSITORY: ${{ needs.validate-config.outputs.template_repository }}
          TEMPLATE_REF: ${{ needs.validate-config.outputs.template_ref }}
          GO_VERSION: ${{ needs.validate-config.outputs.go_version }}
          ANDROID_NDK_VERSION: ${{ needs.validate-config.outputs.android_ndk_version }}
          ANDROID_ABI: ${{ needs.validate-config.outputs.android_abi }}
          XZ_COMPRESSION_LEVEL: ${{ needs.validate-config.outputs.compression_level }}
        run: |
          set -euo pipefail
          release_tag="$RELEASE_TAG"
          generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          mkdir -p normalized-artifacts
          while IFS= read -r channel; do
            mapfile -t cores < <(find verified-artifacts -type f -path "*/${channel}/${ANDROID_ABI}/libmihomocore.so" -print)
            test "${#cores[@]}" -eq 1
            source_dir=$(dirname "${cores[0]}")
            target_dir="normalized-artifacts/${channel}/${ANDROID_ABI}"
            mkdir -p "$target_dir"
            cp "$source_dir/libmihomocore.so" "$source_dir/core-version.properties" "$source_dir/source.json" "$target_dir/"
          done < <(jq -r '.channels[].id' kernel-builder.json)
          scripts/package-release.sh normalized-artifacts release-assets "$release_tag" "$generated_at" "$GITHUB_REPOSITORY" "$TEMPLATE_REPOSITORY" "$TEMPLATE_REF" "$GO_VERSION" "$ANDROID_NDK_VERSION"
          scripts/verify-release.sh release-assets
          {
            printf '# YumeBox Kernel Release\n\n'
            printf 'Only arm64-v8a shared cores are published. Verify kernel-index.json.sha256, then verify the selected asset SHA-256 before installing it.\n\n'
            printf 'Updated at: %s UTC\n\n' "$(jq -r '.generatedAt' release-assets/kernel-index.json)"
            printf '## Kernels\n\n'
            jq -r '.kernels[] | "- **\\(.name)** (`\\(.id)`): `\\(.version)` (`\\(.commit[0:7])`)"' release-assets/kernel-index.json
          } > release-assets/RELEASE_NOTES.md
          printf 'release_tag=%s\n' "$release_tag" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: release-assets-arm64
          path: release-assets
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub prerelease
    needs: [validate-config, package-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets-arm64
          path: release-assets

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ needs.package-release.outputs.release_tag }}
          name: ${{ needs.validate-config.outputs.release_name }}
          body_path: release-assets/RELEASE_NOTES.md
          prerelease: ${{ needs.validate-config.outputs.release_prerelease }}
          make_latest: ${{ needs.validate-config.outputs.release_make_latest }}
          overwrite_files: true
          files: |
            release-assets/*.so.xz
            release-assets/*.so.xz.sha256
            release-assets/kernel-checksums.txt
            release-assets/kernel-index.json
            release-assets/kernel-index.json.sha256
          fail_on_unmatched_files: true
