name: Build Kernel Releases

on:
  push:
    paths:
      - ".github/workflows/build-kernels.yml"
      - ".env.example"
      - "kernel-builder.json"
      - "scripts/**"
      - "patches/**"
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      template_repository:
        description: "Template repository containing the native build adapter (blank: .env)"
        required: false
        type: string
        default: ""
      template_ref:
        description: "Template branch, tag, or commit (blank: .env)"
        required: false
        type: string
        default: ""
      kernel_repository:
        description: "Override the kernel Git URL for every channel (blank: kernel-builder.json)"
        required: false
        type: string
        default: ""
      kernel_ref:
        description: "Override the kernel branch, tag, or commit for every channel (blank: kernel-builder.json)"
        required: false
        type: string
        default: ""
      go_version:
        description: "Go version (blank: .env)"
        required: false
        type: string
        default: ""
      go_download_base_url:
        description: "Go distribution base URL (blank: .env)"
        required: false
        type: string
        default: ""
      android_ndk_version:
        description: "Android NDK version (blank: .env)"
        required: false
        type: string
        default: ""
      android_min_sdk:
        description: "Android minimum SDK (blank: .env)"
        required: false
        type: string
        default: ""
      java_version:
        description: "Java version (blank: .env)"
        required: false
        type: string
        default: ""
  repository_dispatch:
    types: [kernel-update]

permissions:
  contents: write

concurrency:
  group: kernel-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate-config:
    name: Validate configuration
    runs-on: ubuntu-latest
    env:
      INPUT_TEMPLATE_REPOSITORY: ${{ inputs.template_repository }}
      INPUT_TEMPLATE_REF: ${{ inputs.template_ref }}
      INPUT_KERNEL_REPOSITORY: ${{ inputs.kernel_repository }}
      INPUT_KERNEL_REF: ${{ inputs.kernel_ref }}
      INPUT_GO_VERSION: ${{ inputs.go_version }}
      INPUT_GO_DOWNLOAD_BASE_URL: ${{ inputs.go_download_base_url }}
      INPUT_ANDROID_NDK_VERSION: ${{ inputs.android_ndk_version }}
      INPUT_ANDROID_MIN_SDK: ${{ inputs.android_min_sdk }}
      INPUT_JAVA_VERSION: ${{ inputs.java_version }}
    outputs:
      matrix: ${{ steps.config.outputs.matrix }}
      template_repository: ${{ steps.config.outputs.template_repository }}
      template_ref: ${{ steps.config.outputs.template_ref }}
      android_ndk_version: ${{ steps.config.outputs.android_ndk_version }}
      android_min_sdk: ${{ steps.config.outputs.android_min_sdk }}
      android_abi: ${{ steps.config.outputs.android_abi }}
      java_version: ${{ steps.config.outputs.java_version }}
      go_version: ${{ steps.config.outputs.go_version }}
      go_download_base_url: ${{ steps.config.outputs.go_download_base_url }}
      release_tag: ${{ steps.config.outputs.release_tag }}
      release_name: ${{ steps.config.outputs.release_name }}
      release_prerelease: ${{ steps.config.outputs.release_prerelease }}
      release_make_latest: ${{ steps.config.outputs.release_make_latest }}
      compression_level: ${{ steps.config.outputs.compression_level }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - id: config
        name: Parse .env and builder configuration
        run: python3 scripts/kernel_builder.py validate-config --env .env --config kernel-builder.json --github-output "$GITHUB_OUTPUT"

  detect-upstream:
    name: Detect ${{ matrix.channel.id }} upstream
    needs: validate-config
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(needs.validate-config.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve remote commit
        env:
          CHANNEL_ID: ${{ matrix.channel.id }}
          KERNEL_REPOSITORY: ${{ matrix.channel.repository }}
          KERNEL_REF: ${{ matrix.channel.ref }}
          KERNEL_REPOSITORY_TOKEN: ${{ secrets.KERNEL_REPOSITORY_TOKEN }}
        run: python3 scripts/kernel_builder.py detect-upstream --channel-id "$CHANNEL_ID" --repository "$KERNEL_REPOSITORY" --ref "$KERNEL_REF" --token "$KERNEL_REPOSITORY_TOKEN" --output upstream.json

      - uses: actions/upload-artifact@v7
        with:
          name: upstream-arm64-${{ matrix.channel.id }}
          path: upstream.json
          if-no-files-found: error
          retention-days: 2

  build-core:
    name: Build ${{ matrix.channel.id }} arm64
    needs: [validate-config, detect-upstream]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(needs.validate-config.outputs.matrix) }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      ABI_APP_LIST: ${{ needs.validate-config.outputs.android_abi }}
    steps:
      - name: Checkout builder configuration
        uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: upstream-arm64-${{ matrix.channel.id }}
          path: upstream

      - name: Checkout YumeBox source template
        uses: actions/checkout@v6
        with:
          repository: ${{ needs.validate-config.outputs.template_repository }}
          ref: ${{ needs.validate-config.outputs.template_ref }}
          path: app-template
          token: ${{ secrets.TEMPLATE_REPOSITORY_TOKEN || github.token }}
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ needs.validate-config.outputs.java_version }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify YumeBox native source contract
        run: python3 scripts/kernel_builder.py verify-native-source --root app-template

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: ${{ needs.validate-config.outputs.go_download_base_url }}
          go-version: ${{ needs.validate-config.outputs.go_version }}
          cache: false

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699

      - name: Install Android NDK
        run: sdkmanager "ndk;${{ needs.validate-config.outputs.android_ndk_version }}"

      - name: Configure template toolchain
        run: python3 scripts/kernel_builder.py configure-template --root app-template --sdk "$ANDROID_SDK_ROOT" --ndk "${{ needs.validate-config.outputs.android_ndk_version }}"

      - name: Fetch selected kernel source
        env:
          KERNEL_REPOSITORY: ${{ matrix.channel.repository }}
          KERNEL_REF: ${{ matrix.channel.ref }}
          KERNEL_REPOSITORY_TOKEN: ${{ secrets.KERNEL_REPOSITORY_TOKEN }}
        run: python3 scripts/kernel_builder.py fetch-source --root app-template --repository "$KERNEL_REPOSITORY" --ref "$KERNEL_REF" --token "$KERNEL_REPOSITORY_TOKEN" --expected upstream/upstream.json

      - name: Apply channel patches
        env:
          PATCH_DIRECTORY: ${{ matrix.channel.patches }}
        run: python3 scripts/kernel_builder.py apply-patches --source "$PATCH_DIRECTORY" --target app-template/.github/patches/mihomo

      - name: Resolve Go dependencies for selected kernel
        run: python3 scripts/kernel_builder.py resolve-go-dependencies --root app-template

      - name: Build ARM64 core through the native adapter
        working-directory: app-template
        env:
          EXTERNAL_MIHOMO_BRANCH: ${{ matrix.channel.id }}
          EXTERNAL_MIHOMO_SUFFIX: ${{ matrix.channel.suffix }}
          ANDROID_MINSDK: ${{ needs.validate-config.outputs.android_min_sdk }}
          ANDROID_NDKVERSION: ${{ needs.validate-config.outputs.android_ndk_version }}
        run: python3 scripts/native-build.py --go

      - name: Record immutable source metadata
        env:
          KERNEL_REPOSITORY: ${{ matrix.channel.repository }}
          KERNEL_REF: ${{ matrix.channel.ref }}
          EXPECTED_COMMIT_FILE: ${{ github.workspace }}/upstream/upstream.json
        run: python3 scripts/kernel_builder.py record-metadata --root app-template --abi "${{ needs.validate-config.outputs.android_abi }}" --repository "$KERNEL_REPOSITORY" --ref "$KERNEL_REF" --expected "$EXPECTED_COMMIT_FILE"

      - name: Stage raw core
        run: python3 scripts/kernel_builder.py copy-artifact --source "app-template/jniLibs/${{ needs.validate-config.outputs.android_abi }}" --target "kernel-artifact/${{ matrix.channel.id }}/${{ needs.validate-config.outputs.android_abi }}"

      - uses: actions/upload-artifact@v7
        with:
          name: raw-arm64-${{ matrix.channel.id }}
          path: kernel-artifact
          if-no-files-found: error
          retention-days: 7

  verify-core:
    name: Verify ${{ matrix.channel.id }} arm64
    needs: [validate-config, build-core]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(needs.validate-config.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v8
        with:
          name: raw-arm64-${{ matrix.channel.id }}
          path: raw-artifacts

      - name: Verify Android ELF and native entrypoint contract
        run: python3 scripts/kernel_builder.py verify-core --root raw-artifacts --abi "${{ needs.validate-config.outputs.android_abi }}"

      - name: Stage verified core
        run: python3 scripts/kernel_builder.py stage-verified-artifact --root raw-artifacts --channel "${{ matrix.channel.id }}" --abi "${{ needs.validate-config.outputs.android_abi }}" --target "verified-artifact/${{ matrix.channel.id }}/${{ needs.validate-config.outputs.android_abi }}"

      - uses: actions/upload-artifact@v7
        with:
          name: verified-arm64-${{ matrix.channel.id }}
          path: verified-artifact
          if-no-files-found: error
          retention-days: 7

  package-release:
    name: Compress cores and generate release JSON
    needs: [validate-config, verify-core]
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v8
        with:
          pattern: verified-arm64-*
          path: verified-artifacts
          merge-multiple: true

      - id: release
        name: Package assets, checksums, and manifest
        env:
          RELEASE_TAG: ${{ needs.validate-config.outputs.release_tag }}
          TEMPLATE_REPOSITORY: ${{ needs.validate-config.outputs.template_repository }}
          TEMPLATE_REF: ${{ needs.validate-config.outputs.template_ref }}
          GO_VERSION: ${{ needs.validate-config.outputs.go_version }}
          ANDROID_NDK_VERSION: ${{ needs.validate-config.outputs.android_ndk_version }}
          ANDROID_ABI: ${{ needs.validate-config.outputs.android_abi }}
          XZ_COMPRESSION_LEVEL: ${{ needs.validate-config.outputs.compression_level }}
        run: python3 scripts/kernel_builder.py package-release --root verified-artifacts --output release-assets --release-tag "$RELEASE_TAG" --release-repository "$GITHUB_REPOSITORY" --template-repository "$TEMPLATE_REPOSITORY" --template-ref "$TEMPLATE_REF" --go-version "$GO_VERSION" --ndk-version "$ANDROID_NDK_VERSION" --abi "$ANDROID_ABI" --compression-level "$XZ_COMPRESSION_LEVEL" --github-output "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: release-assets-arm64
          path: release-assets
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub prerelease
    needs: [validate-config, package-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets-arm64
          path: release-assets

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ needs.package-release.outputs.release_tag }}
          name: ${{ needs.validate-config.outputs.release_name }}
          body_path: release-assets/RELEASE_NOTES.md
          prerelease: ${{ needs.validate-config.outputs.release_prerelease }}
          make_latest: ${{ needs.validate-config.outputs.release_make_latest }}
          overwrite_files: true
          files: |
            release-assets/*.so.xz
            release-assets/kernel-index.json
          fail_on_unmatched_files: true

  notify-telegram:
    name: Notify Telegram
    needs: [validate-config, package-release, publish-release]
    runs-on: ubuntu-latest
    if: always() && needs.publish-release.result == 'success'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Send release notification
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          RELEASE_NAME: ${{ needs.validate-config.outputs.release_name }}
          RELEASE_TAG: ${{ needs.package-release.outputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
        run: python3 scripts/kernel_builder.py notify-telegram --release-name "$RELEASE_NAME" --release-tag "$RELEASE_TAG" --repository "$REPOSITORY"
