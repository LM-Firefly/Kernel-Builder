---
name: Build Kernel Releases

on:
  push:
    paths:
      - ".github/workflows/build-kernels.yml"
      - ".env.example"
      - "kernel-builder.json"
      - "scripts/**"
      - "patches/**"
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      release_mode:
        description: "Choose the official kernels or one custom kernel"
        required: false
        type: choice
        options: [official, custom]
        default: official
      kernel_repository:
        description: >-
          Custom kernel repository URL (required only for custom mode)
        required: false
        type: string
        default: ""
  repository_dispatch:
    types: [kernel-update]

permissions:
  contents: write

concurrency:
  group: kernel-release-${{ github.repository }}
  cancel-in-progress: true

jobs:
  validate-config:
    name: Validate configuration
    runs-on: ubuntu-latest
    env:
      INPUT_KERNEL_REPOSITORY: ${{ inputs.kernel_repository }}
      INPUT_RELEASE_MODE: ${{ inputs.release_mode }}
    outputs:
      matrix: ${{ steps.config.outputs.matrix }}
      template_repository: ${{ steps.config.outputs.template_repository }}
      template_ref: ${{ steps.config.outputs.template_ref }}
      android_ndk_version: ${{ steps.config.outputs.android_ndk_version }}
      android_min_sdk: ${{ steps.config.outputs.android_min_sdk }}
      java_version: ${{ steps.config.outputs.java_version }}
      release_mode: ${{ steps.config.outputs.release_mode }}
      go_version: ${{ steps.config.outputs.go_version }}
      go_download_base_url: ${{ steps.config.outputs.go_download_base_url }}
      release_tag: ${{ steps.config.outputs.release_tag }}
      release_prerelease: ${{ steps.config.outputs.release_prerelease }}
      release_make_latest: ${{ steps.config.outputs.release_make_latest }}
      release_name: ${{ steps.config.outputs.release_name }}
      custom_version: ${{ steps.config.outputs.custom_version }}
      compression_level: ${{ steps.config.outputs.compression_level }}
      distinct_abis: ${{ steps.config.outputs.distinct_abis }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - id: config
        name: Parse .env and builder configuration
        run: >-
          python3 scripts/kernel_builder.py validate-config --env .env
          --config kernel-builder.json --github-output "$GITHUB_OUTPUT"

  detect-upstream:
    name: Detect ${{ matrix.channel.id }} ${{ matrix.channel.abi }}
    needs: validate-config
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(needs.validate-config.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve remote commit
        env:
          CHANNEL_ID: ${{ matrix.channel.id }}
          KERNEL_REPOSITORY: ${{ matrix.channel.repository }}
          KERNEL_REF: ${{ matrix.channel.ref }}
          KERNEL_REPOSITORY_TOKEN: ${{ secrets.KERNEL_REPOSITORY_TOKEN }}
        run: >-
          python3 scripts/kernel_builder.py detect-upstream
          --channel-id "$CHANNEL_ID" --repository "$KERNEL_REPOSITORY"
          --ref "$KERNEL_REF" --token "$KERNEL_REPOSITORY_TOKEN"
          --output upstream.json

      - uses: actions/upload-artifact@v7
        with:
          name: upstream-${{ matrix.channel.abi }}-${{ matrix.channel.id }}
          path: upstream.json
          if-no-files-found: error
          compression-level: 0

  build-core:
    name: Build ${{ matrix.channel.id }} ${{ matrix.channel.abi }}
    needs: [validate-config, detect-upstream]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(needs.validate-config.outputs.matrix) }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      ABI_APP_LIST: ${{ matrix.channel.abi }}
    steps:
      - name: Checkout builder configuration
        uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: upstream-${{ matrix.channel.abi }}-${{ matrix.channel.id }}
          path: upstream

      - name: Checkout FlyCat source template
        uses: actions/checkout@v6
        with:
          repository: ${{ needs.validate-config.outputs.template_repository }}
          ref: ${{ needs.validate-config.outputs.template_ref }}
          path: app-template
          token: ${{ secrets.TEMPLATE_REPOSITORY_TOKEN || github.token }}
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ needs.validate-config.outputs.java_version }}
          cache: gradle

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify FlyCat native source contract
        run: >-
          python3 scripts/kernel_builder.py verify-native-source
          --root app-template

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: >-
            ${{ needs.validate-config.outputs.go_download_base_url }}
          go-version: ${{ needs.validate-config.outputs.go_version }}
          cache: true

      - uses: >-
          android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699

      - name: Install Android NDK
        env:
          ANDROID_NDK_VERSION: >-
            ${{ needs.validate-config.outputs.android_ndk_version }}
        run: sdkmanager "ndk;$ANDROID_NDK_VERSION"

      - name: Configure template toolchain
        run: >-
          python3 scripts/kernel_builder.py configure-template
          --root app-template --sdk "$ANDROID_SDK_ROOT"
          --ndk "${{ needs.validate-config.outputs.android_ndk_version }}"

      - name: Fetch selected kernel source
        env:
          KERNEL_REPOSITORY: ${{ matrix.channel.repository }}
          KERNEL_REF: ${{ matrix.channel.ref }}
          KERNEL_REPOSITORY_TOKEN: ${{ secrets.KERNEL_REPOSITORY_TOKEN }}
        run: >-
          python3 scripts/kernel_builder.py fetch-source --root app-template
          --repository "$KERNEL_REPOSITORY" --ref "$KERNEL_REF"
          --token "$KERNEL_REPOSITORY_TOKEN" --expected upstream/upstream.json

      - name: Apply channel patches
        env:
          PATCH_DIRECTORY: ${{ matrix.channel.patches }}
        run: >-
          python3 scripts/kernel_builder.py apply-patches
          --source "$PATCH_DIRECTORY"
          --target app-template/.github/patches/mihomo

      - name: Resolve Go dependencies for selected kernel
        run: >-
          python3 scripts/kernel_builder.py resolve-go-dependencies
          --root app-template

      - name: Build core through the native adapter
        working-directory: app-template
        env:
          EXTERNAL_MIHOMO_BRANCH: ${{ matrix.channel.id }}
          EXTERNAL_MIHOMO_SUFFIX: ${{ matrix.channel.suffix }}
          ANDROID_MINSDK: ${{ needs.validate-config.outputs.android_min_sdk }}
          ANDROID_NDKVERSION: >-
            ${{ needs.validate-config.outputs.android_ndk_version }}
          GOLANG_BUILDTAGS: ${{ matrix.channel.buildTags }}
        run: python3 scripts/native-build.py --go

      - name: Record immutable source metadata
        env:
          KERNEL_REPOSITORY: ${{ matrix.channel.repository }}
          KERNEL_REF: ${{ matrix.channel.ref }}
          EXPECTED_COMMIT_FILE: ${{ github.workspace }}/upstream/upstream.json
        run: >-
          python3 scripts/kernel_builder.py record-metadata --root app-template
          --abi "${{ matrix.channel.abi }}"
          --repository "$KERNEL_REPOSITORY" --ref "$KERNEL_REF"
          --expected "$EXPECTED_COMMIT_FILE"

      - name: Stage raw core
        env:
          ANDROID_ABI: ${{ matrix.channel.abi }}
          CHANNEL_ID: ${{ matrix.channel.id }}
        run: >-
          python3 scripts/kernel_builder.py copy-artifact
          --source "app-template/jniLibs/$ANDROID_ABI"
          --target "kernel-artifact/$CHANNEL_ID/$ANDROID_ABI"

      - uses: actions/upload-artifact@v7
        with:
          name: raw-${{ matrix.channel.abi }}-${{ matrix.channel.id }}
          path: kernel-artifact
          if-no-files-found: error
          retention-days: 7

  verify-core:
    name: Verify ${{ matrix.channel.id }} ${{ matrix.channel.abi }}
    needs: [validate-config, build-core]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(needs.validate-config.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v8
        with:
          name: raw-${{ matrix.channel.abi }}-${{ matrix.channel.id }}
          path: raw-artifacts

      - name: Verify Android ELF and native entrypoint contract
        env:
          ANDROID_ABI: ${{ matrix.channel.abi }}
        run: >-
          python3 scripts/kernel_builder.py verify-core --root raw-artifacts
          --abi "$ANDROID_ABI"

      - name: Stage verified core
        env:
          ANDROID_ABI: ${{ matrix.channel.abi }}
          CHANNEL_ID: ${{ matrix.channel.id }}
        run: >-
          python3 scripts/kernel_builder.py stage-verified-artifact
          --root raw-artifacts --channel "$CHANNEL_ID"
          --abi "$ANDROID_ABI"
          --target "verified-artifact/$CHANNEL_ID/$ANDROID_ABI"

      - uses: actions/upload-artifact@v7
        with:
          name: verified-${{ matrix.channel.abi }}-${{ matrix.channel.id }}
          path: verified-artifact
          if-no-files-found: error
          retention-days: 7

  package-release:
    name: Package ${{ matrix.abi }} release
    needs: [validate-config, verify-core]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: ${{ fromJSON(needs.validate-config.outputs.distinct_abis) }}
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v8
        with:
          pattern: verified-${{ matrix.abi }}-*
          path: verified-artifacts
          merge-multiple: true

      - id: release
        name: Package assets, checksums, and manifest
        env:
          RELEASE_TAG: ${{ needs.validate-config.outputs.release_tag }}
          TEMPLATE_REPOSITORY: >-
            ${{ needs.validate-config.outputs.template_repository }}
          TEMPLATE_REF: ${{ needs.validate-config.outputs.template_ref }}
          GO_VERSION: ${{ needs.validate-config.outputs.go_version }}
          ANDROID_NDK_VERSION: >-
            ${{ needs.validate-config.outputs.android_ndk_version }}
          ANDROID_ABI: ${{ matrix.abi }}
          CHANNELS_JSON: >-
            ${{ needs.validate-config.outputs.matrix }}
          CUSTOM_VERSION: ${{ needs.validate-config.outputs.custom_version }}
          XZ_COMPRESSION_LEVEL: >-
            ${{ needs.validate-config.outputs.compression_level }}
        run: |
          # Filter channels to only those that include this ABI.
          FILTERED=$(echo "$CHANNELS_JSON" | python3 -c "
          import json, sys
          channels = json.load(sys.stdin)
          abi = '${{ matrix.abi }}'
          print(json.dumps([c for c in channels if c.get('abi') == abi]))
          ")
          python3 scripts/kernel_builder.py package-release \
            --root verified-artifacts --output release-assets \
            --release-tag "$RELEASE_TAG" \
            --release-repository "$GITHUB_REPOSITORY" \
            --release-mode "${{ needs.validate-config.outputs.release_mode }}" \
            --channels-json "$FILTERED" \
            --version-override "$CUSTOM_VERSION" \
            --builder-repository "$GITHUB_REPOSITORY" \
            --builder-workflow ".github/workflows/build-kernels.yml" \
            --builder-run-id "$GITHUB_RUN_ID" --builder-sha "$GITHUB_SHA" \
            --template-repository "$TEMPLATE_REPOSITORY" \
            --template-ref "$TEMPLATE_REF" --go-version "$GO_VERSION" \
            --ndk-version "$ANDROID_NDK_VERSION" --abi "$ANDROID_ABI" \
            --compression-level "$XZ_COMPRESSION_LEVEL" \
            --github-output "$GITHUB_OUTPUT"

      - name: Prepare clean release assets
        env:
          RELEASE_MODE: ${{ needs.validate-config.outputs.release_mode }}
        run: |
          mkdir -p release-assets/publish-assets
          if [ "$RELEASE_MODE" = custom ]; then
            cp release-assets/kernel-plugin.zip release-assets/publish-assets/
          else
            cp release-assets/kernel-index*.json release-assets/publish-assets/ 2>/dev/null || true
            cp release-assets/kernel-release*.json release-assets/publish-assets/ 2>/dev/null || true
            cp release-assets/RELEASE_NOTES.md release-assets/publish-assets/ 2>/dev/null || true
            cp release-assets/*.so.xz release-assets/publish-assets/
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ matrix.abi }}
          path: release-assets
          if-no-files-found: error
          compression-level: 0

  publish-release:
    name: Publish GitHub prerelease
    needs: [validate-config, package-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - uses: >-
          softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ needs.package-release.outputs.release_tag }}
          name: ${{ needs.validate-config.outputs.release_name }}
          prerelease: ${{ needs.validate-config.outputs.release_prerelease }}
          make_latest: ${{ needs.validate-config.outputs.release_make_latest }}
          overwrite_files: true
          files: |
            release-assets/publish-assets/*
          fail_on_unmatched_files: true

